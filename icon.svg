<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgScent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="dropGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <style>
      @keyframes floatDrop {
        0%, 100% { transform: translateY(0px) scale(1); }
        50% { transform: translateY(-10px) scale(1.02); }
      }
      .scent-drop { transform-origin: 256px 230px; animation: floatDrop 3s ease-in-out infinite; }
      @keyframes bubbleFloat1 {
        0% { transform: translateY(0px) scale(0.8); opacity: 0.4; }
        50% { transform: translateY(-25px) scale(1.1); opacity: 0.9; }
        100% { transform: translateY(-50px) scale(0.6); opacity: 0; }
      }
      .bubble-1 { animation: bubbleFloat1 3.5s ease-in-out infinite; }
      .bubble-2 { animation: bubbleFloat1 2.8s ease-in-out infinite 1.2s; }
      .bubble-3 { animation: bubbleFloat1 4s ease-in-out infinite 0.5s; }
      @keyframes wavePulse {
        0%, 100% { transform: scale(0.95); opacity: 0.3; }
        50% { transform: scale(1.08); opacity: 0.8; }
      }
      .aroma-wave { transform-origin: 256px 260px; animation: wavePulse 2.2s ease-in-out infinite; }
    </style>
  </defs>

  <rect width="512" height="512" rx="115" fill="url(#bgScent)" />
  <rect x="40" y="40" width="432" height="432" rx="90" fill="#ffffff" opacity="0.08" />

  <g class="aroma-wave" fill="none" stroke="#6ee7b7" stroke-width="4" stroke-dasharray="8,8" opacity="0.6">
    <circle cx="256" cy="256" r="170" />
    <circle cx="256" cy="256" r="140" stroke="#bae6fd" />
  </g>

  <g fill="#ffffff" opacity="0.85">
    <circle class="bubble-1" cx="170" cy="180" r="18" />
    <circle class="bubble-2" cx="340" cy="160" r="12" />
    <circle class="bubble-3" cx="310" cy="350" r="22" />
    <circle class="bubble-1" cx="190" cy="330" r="14" />
  </g>

  <g class="scent-drop">
    <path d="M 230 150 L 282 150 L 282 195 L 320 280 C 335 315 310 355 272 355 L 240 355 C 202 355 177 315 192 280 L 230 195 Z" fill="none" stroke="#ffffff" stroke-width="12" stroke-linejoin="round" />
    <rect x="222" y="126" width="68" height="24" rx="6" fill="#fde047" />
    <path d="M 205 275 C 220 265 292 265 307 275 C 320 305 298 343 272 343 L 240 343 C 214 343 192 305 205 275 Z" fill="#38bdf8" opacity="0.8" filter="url(#softGlow)" />
    <path d="M 256 190 C 256 190 286 230 286 252 C 286 268 273 281 256 281 C 239 281 226 268 226 252 C 226 230 256 190 256 190 Z" fill="url(#dropGrad)" filter="url(#softGlow)" />
    <path d="M 248 235 C 250 225 258 215 264 205 C 262 220 258 235 248 235 Z" fill="#ffffff" opacity="0.7" />
  </g>

  <g fill="#fde047" filter="url(#softGlow)">
    <path d="M 120 140 Q 120 160 140 160 Q 120 160 120 180 Q 120 160 100 160 Q 120 160 120 140 Z" />
    <path d="M 390 290 Q 390 310 410 310 Q 390 310 390 330 Q 390 310 370 310 Q 390 310 390 290 Z" />
  </g>
</svg>
